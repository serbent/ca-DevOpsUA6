kind: Deployment
apiVersion: apps/v1
metadata:
  name: my-app
spec:
  replicas: 10
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: serbentas/ca-devops-ua6:latest
        ports:
        - containerPort: 80