name: AutoBuild lecture 13

on: 
  push:
    branches:
      - main
    paths:
      - 13/multi/**

jobs:
    build:
        runs-on: ubuntu-latest
        run: 
          working-directory: 13/multi
        steps:
            - uses: actions/checkout@v6
            - name: Build
              run: docker build -t serpent/ca-devops-ua6:v0.20 .
            - name: Login
              run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            - name: Push
              run: docker push serpent/ca-devops-ua6:v0.20
